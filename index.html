<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flush Flow - 화장실 건강 지키미</title>
  
  <!-- Google Fonts: Quicksand (Stitch rounded spec) & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Stitch Soft Minimalism Spec */
      --bg-color: #f8f9fa;             /* Bright Neutral Base */
      --surface: #ffffff;
      --surface-container: #edeeef;
      --surface-container-low: #f3f4f5;
      
      --text-main: #191c1d;            
      --text-muted: #3d4a3e;           
      --outline: #6d7b6d;
      --outline-variant: #bccabb;
      
      /* Dynamic Alert States */
      --color-safe: #4ade80;           /* Green */
      --color-warn: #fed01b;           /* Yellow */
      --color-danger: #ef4444;         /* Red */
      --color-off: #cbd5e1;
      
      /* Active state dynamic color tracker */
      --active-theme-color: var(--color-safe);
      --active-glow-color: rgba(74, 222, 128, 0.25);
      
      /* Ambient Shadows */
      --shadow-ambient: 0 10px 30px rgba(25, 28, 29, 0.05);
      
      --font-ui: 'Quicksand', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #d9dadb;
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.4s ease;
    }

    /* Mobile Frame container (Stitch Mobile Spec) */
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(25, 28, 29, 0.12);
      border: 1px solid var(--outline-variant);
      transition: all 0.4s ease;
    }

    @media (min-width: 441px) {
      .app-container {
        height: 850px;
        border-radius: 36px;
        border: 10px solid var(--text-main);
      }
    }

    /* Minimalist Header */
    header {
      padding: 24px 24px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo i {
      color: var(--active-theme-color);
      transition: color 0.4s ease;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 999px; /* Pill */
      font-size: 11px;
      font-weight: 700;
      background: var(--surface);
      border: 2px solid var(--outline-variant);
      box-shadow: var(--shadow-ambient);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-off);
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      border-color: var(--active-theme-color);
      box-shadow: 0 0 15px var(--active-glow-color);
    }

    .status-badge.connected .status-dot {
      background-color: var(--active-theme-color);
    }

    .status-badge.connecting .status-dot {
      background-color: var(--color-warn);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* Main Center Layout */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 40px;
    }

    /* Circular Timer Section (Fluid Center-Weight Spec) */
    .timer-center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: auto;
    }

    .timer-ring-outer {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--surface-container);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--shadow-ambient);
      transition: border-color 0.4s ease;
    }

    .timer-ring-outer::after {
      content: '';
      position: absolute;
      width: 206px;
      height: 206px;
      border-radius: 50%;
      background: var(--bg-color);
      border: 1px solid var(--outline-variant);
      z-index: 1;
    }

    .timer-progress {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(var(--active-theme-color) var(--timer-angle, 0deg), transparent var(--timer-angle, 0deg));
      mask: radial-gradient(transparent 102px, #000 103px);
      -webkit-mask: radial-gradient(transparent 102px, #000 103px);
      z-index: 2;
      transform: rotate(-90deg);
      transition: background 0.4s ease, transform 0.1s linear;
    }

    .timer-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Character Area - Floating Spec */
    .character-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90px;
      margin-bottom: 2px;
      animation: floatCharacter 3.2s ease-in-out infinite;
    }

    .character-svg {
      transition: all 0.4s ease;
    }

    @keyframes floatCharacter {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }

    .timer-time-display {
      font-family: var(--font-mono);
      font-size: 46px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .timer-status-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* Warning Message Banner */
    #warning-banner {
      display: none;
      color: #ffffff;
      background-color: var(--color-danger);
      font-weight: 700;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 999px; /* Pill */
      margin-top: 24px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: blinkWarning 0.8s infinite alternate;
    }

    @keyframes blinkWarning {
      0% { opacity: 0.85; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    /* Squishy Pill Buttons Bottom Bar */
    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .btn-pill-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-squishy {
      border: 2px solid var(--outline-variant);
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 999px; /* Pill shape */
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-ambient);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-ui);
      position: relative;
      top: 0;
    }

    .btn-squishy:hover {
      border-color: var(--active-theme-color);
      background: var(--surface-container-low);
      box-shadow: 0 8px 20px rgba(0, 109, 54, 0.04);
    }

    .btn-squishy:active {
      top: 2.5px;
      box-shadow: none;
      background: var(--surface-container);
    }

    .btn-squishy i {
      font-size: 16px;
      color: var(--active-theme-color);
      transition: color 0.4s ease;
    }

    .btn-squishy-danger {
      grid-column: span 2;
      border-color: var(--outline-variant);
    }
    .btn-squishy-danger i {
      color: var(--color-danger);
    }

    /* Minimalist Floating Logs Console */
    .log-toggle-container {
      width: 100%;
    }

    .btn-toggle-logs {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      transition: color 0.2s;
    }

    .btn-toggle-logs:hover {
      color: var(--text-main);
    }

    .terminal-panel {
      display: none;
      height: 180px;
      background: var(--text-main);
      border-radius: 20px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.05);
      flex-direction: column;
      margin-top: 10px;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .terminal-log {
      flex: 1;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-item {
      line-height: 1.4;
      word-break: break-all;
      color: #e0e7ff;
    }

    .log-time {
      color: rgba(255,255,255,0.3);
      margin-right: 4px;
    }

    .log-direction {
      font-weight: 700;
      margin-right: 4px;
    }
    .log-direction.tx { color: var(--color-safe); }
    .log-direction.rx { color: var(--color-warn); }
    .log-direction.sys { color: #818cf8; }

    /* Overlay setup */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(248, 249, 250, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
      transition: all 0.5s ease;
    }

    .overlay-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--outline-variant);
      box-shadow: var(--shadow-ambient);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      color: var(--primary);
      margin-bottom: 20px;
      position: relative;
    }

    .overlay-logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--color-safe);
      opacity: 0.15;
      animation: ripple 2s infinite ease-out;
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .overlay-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .overlay-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .connect-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(25, 28, 29, 0.15);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      top: 0;
    }

    .connect-btn:hover {
      background: #000000;
      transform: scale(1.02);
    }

    .connect-btn:active {
      top: 3px;
      box-shadow: none;
    }

    .connect-btn i {
      font-size: 28px;
    }

    #overlay-error-msg {
      color: var(--color-danger);
      font-size: 12px;
      margin-top: 18px;
      font-weight: 700;
      min-height: 18px;
    }

    .setting-input {
      border: 2px solid var(--outline-variant);
      outline: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--surface);
      color: var(--text-main);
      width: 200px;
      text-align: center;
      margin-top: 12px;
      box-shadow: var(--shadow-ambient);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Connection Overlay Screen -->
    <div class="overlay" id="connection-overlay">
      <div class="overlay-logo">
        <div class="overlay-logo-ring"></div>
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <h1 class="overlay-title">Flush Flow</h1>
      <p class="overlay-desc">화장실에서의 건강한 약속을 위해<br>블루투스 기기(ESP_KJ)에 연결해 주세요.</p>
      
      <button class="connect-btn" id="btn-overlay-connect">
        <i class="fa-brands fa-bluetooth-b"></i>
        <span>기기 연결</span>
      </button>
      <div id="overlay-error-msg"></div>
 
      <input type="text" class="setting-input" id="input-device-prefix" value="ESP_KJ" placeholder="기기 필터">
    </div>
  
    <!-- Header Section -->
    <header>
      <div class="brand-logo">
        <i class="fa-solid fa-toilet"></i>
        <span>Flush Flow</span>
      </div>
      <button class="status-badge" id="btn-header-connect">
        <div class="status-dot"></div>
        <span id="txt-status">연결 대기</span>
      </button>
    </header>

    <!-- Main Viewport Area -->
    <div class="main-viewport">
      
      <!-- Timer Focus Group -->
      <div class="timer-center-wrap">
        <div class="timer-ring-outer">
          <div class="timer-progress" id="timer-progress"></div>
          <div class="timer-content">
            <!-- Dynamic Toilet Character SVG (Stitch Spec) -->
            <div class="character-container" id="character-box">
              <svg class="character-svg" viewBox="0 0 100 100" width="84" height="84">
                <!-- Toilet Silhouette -->
                <path d="M30 68 C30 48, 70 48, 70 68 Z" fill="#e2e8f0" stroke="var(--text-muted)" stroke-width="3"/>
                <rect x="25" y="68" width="50" height="12" rx="4" fill="#cbd5e1" stroke="var(--text-muted)" stroke-width="3"/>
                
                <!-- Character Body (gradient mapped to status color) -->
                <circle cx="50" cy="40" r="20" id="char-body" fill="var(--active-theme-color)" stroke="var(--text-main)" stroke-width="3.5" style="transition: fill 0.5s ease;"/>
                
                <!-- Eyes Group -->
                <g id="char-eyes">
                  <circle cx="43" cy="38" r="2.5" fill="var(--text-main)"/>
                  <circle cx="57" cy="38" r="2.5" fill="var(--text-main)"/>
                </g>
                <!-- Mouth -->
                <path id="char-mouth" d="M46 48 Q50 51 54 48" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            
            <span class="timer-time-display" id="timer-time">00:00</span>
            <span class="timer-status-text" id="timer-status">대기 중</span>
          </div>
        </div>
        
        <!-- Overtime Danger Warning Banner -->
        <div id="warning-banner">
          ⚠️ 화장실에 오래 앉아있으면 건강에 위험합니다!
        </div>
      </div>

      <!-- Pill Shaped Action Buttons -->
      <div class="bottom-controls">
        <div class="btn-pill-group">
          <button class="btn-squishy" id="btn-trigger-timer">
            <i class="fa-solid fa-play"></i>
            <span>시작 / 정지</span>
          </button>
          <button class="btn-squishy" id="btn-reset-timer">
            <i class="fa-solid fa-arrow-rotate-left"></i>
            <span>리셋</span>
          </button>
          <button class="btn-squishy btn-squishy-danger" id="btn-mute-buzzer">
            <i class="fa-solid fa-volume-xmark"></i>
            <span>경고음 끄기 (수동 음소거)</span>
          </button>
        </div>

        <!-- Toggleable Debug Logs console -->
        <div class="log-toggle-container">
          <button class="btn-toggle-logs" id="btn-toggle-logs">
            <i class="fa-solid fa-terminal"></i>
            <span>통신 로그 보기</span>
          </button>
          <div class="terminal-panel" id="terminal-panel">
            <div class="terminal-header">
              <span>COMMUNICATION TERMINAL</span>
              <span id="btn-clear-logs" style="cursor:pointer;"><i class="fa-solid fa-trash-can"></i> 비우기</span>
            </div>
            <div class="terminal-log" id="terminal-log">
              <div class="log-item">
                <span class="log-time">[00:00:00]</span>
                <span class="log-direction sys">[SYS]</span>
                <span class="log-msg">Flush Flow 앱이 실행되었습니다.</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // BLE NUS Protocol Specifications
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let bluetoothDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let rxBuffer = '';

    // DOM Elements
    const connectionOverlay = document.getElementById('connection-overlay');
    const inputDevicePrefix = document.getElementById('input-device-prefix');
    const btnOverlayConnect = document.getElementById('btn-overlay-connect');
    const btnHeaderConnect = document.getElementById('btn-header-connect');
    const txtStatus = document.getElementById('txt-status');
    const terminalLog = document.getElementById('terminal-log');
    
    const timerProgress = document.getElementById('timer-progress');
    const timerTime = document.getElementById('timer-time');
    const timerStatus = document.getElementById('timer-status');
    const warningBanner = document.getElementById('warning-banner');

    const charBody = document.getElementById('char-body');
    const charMouth = document.getElementById('char-mouth');
    const charEyes = document.getElementById('char-eyes');

    // UI Styles Toggler helper
    function updateTheme(colorHex, glowHex) {
      document.documentElement.style.setProperty('--active-theme-color', colorHex);
      document.documentElement.style.setProperty('--active-glow-color', glowHex);
    }

    function updateStatus(text, stateClass) {
      txtStatus.innerText = text;
      
      const badge = document.getElementById('btn-header-connect');
      badge.className = 'status-badge'; 
      if (stateClass) {
        badge.classList.add(stateClass);
      }
      logTerminal('SYS', `연결 상태 변경: ${text}`);
    }

    // Connect to Bluetooth BLE Device
    async function connectBLE() {
      document.getElementById('overlay-error-msg').innerText = '';
      const nameFilter = inputDevicePrefix.value.trim() || 'ESP_';
      updateStatus('스캔 중...', 'connecting');
      
      try {
        logTerminal('SYS', `기기명 필터 '${nameFilter}'(으)로 블루투스 기기 스캔 중...`);
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: nameFilter }
          ],
          optionalServices: [NUS_SERVICE_UUID]
        });

        logTerminal('SYS', `기기 선택 완료: ${bluetoothDevice.name}. 연결 시작...`);
        updateStatus('연결 중...', 'connecting');

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        logTerminal('SYS', 'GATT 서버 연결 성공. 서비스 탐색 중...');
        
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        logTerminal('SYS', 'NUS 서비스 탐색 완료. 데이터 채널 연결 중...');

        rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
        txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

        logTerminal('SYS', '데이터 수신 리스너 등록...');
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        updateStatus('연결됨', 'connected');
        connectionOverlay.style.display = 'none';

      } catch (error) {
        console.error('BLE Connection error:', error);
        logTerminal('SYS', `오류 발생: ${error.message || error}`);
        updateStatus('연결 대기', 'disconnected');
        document.getElementById('overlay-error-msg').innerText = '오류: ' + (error.message || error);
        
        bluetoothDevice = null;
        rxCharacteristic = null;
        txCharacteristic = null;
      }
    }

    function onDisconnected(event) {
      logTerminal('SYS', '블루투스 연결이 해제되었습니다.');
      updateStatus('연결 대기', 'disconnected');
      connectionOverlay.style.display = 'flex';
      
      // Reset UI
      timerTime.innerText = '00:00';
      timerStatus.innerText = '대기 중';
      timerProgress.style.setProperty('--timer-angle', '0deg');
      warningBanner.style.display = 'none';
      
      resetCharacterDesign();
      
      bluetoothDevice = null;
      rxCharacteristic = null;
      txCharacteristic = null;
    }

    // Send command to ESP32
    async function sendCommand(charCommand) {
      if (!rxCharacteristic) {
        logTerminal('SYS', '경고: 블루투스가 연결되어 있지 않습니다.');
        return;
      }
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(charCommand);
        await rxCharacteristic.writeValueWithoutResponse(data);
        logTerminal('TX', charCommand);
      } catch (error) {
        logTerminal('SYS', `송신 에러: ${error.message}`);
      }
    }

    // Buffer incoming serial data
    function handleNotifications(event) {
      const value = event.target.value;
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(value);
      
      rxBuffer += text;
      let lines = rxBuffer.split('\n');
      rxBuffer = lines.pop(); // Hold incomplete lines
      
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        
        logTerminal('RX', line);
        parseIncomingLine(line);
      }
    }

    // Dynamic Character Face & Color States
    function resetCharacterDesign() {
      updateTheme('#cbd5e1', 'rgba(203, 213, 225, 0.2)');
      if (charMouth) charMouth.setAttribute('d', 'M46 48 Q50 51 54 48');
      if (charEyes) charEyes.innerHTML = '<circle cx="43" cy="38" r="2.5" fill="var(--text-main)"/><circle cx="57" cy="38" r="2.5" fill="var(--text-main)"/>';
    }

    function updateCharacterState(color) {
      if (color === 'GREEN') {
        updateTheme('var(--color-safe)', 'rgba(74, 222, 128, 0.25)');
        if (charMouth) charMouth.setAttribute('d', 'M46 48 Q50 53 54 48'); // 웃음
        if (charEyes) charEyes.innerHTML = '<path d="M40 38 Q43 35 45 38" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/><path d="M55 38 Q57 35 59 38" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/>'; // 행복한 눈
      } 
      else if (color === 'YELLOW') {
        updateTheme('var(--color-warn)', 'rgba(254, 208, 27, 0.25)');
        if (charMouth) charMouth.setAttribute('d', 'M45 49 L55 49'); // 일자
        if (charEyes) charEyes.innerHTML = '<path d="M41 39 Q43 36 45 39" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/><path d="M55 39 Q57 36 59 39" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/>'; // 걱정스러운 눈
      } 
      else if (color === 'RED') {
        updateTheme('var(--color-danger)', 'rgba(239, 68, 68, 0.25)');
        if (charMouth) charMouth.setAttribute('d', 'M46 51 Q50 46 54 51'); // 슬픔
        if (charEyes) charEyes.innerHTML = '<path d="M40 36 L45 41 M45 36 L40 41" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/><path d="M55 36 L60 41 M60 36 L55 41" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round"/>'; // X 모양 눈
      } 
      else {
        resetCharacterDesign();
      }
    }

    // Parse incoming data packets
    function parseIncomingLine(line) {
      if (line.startsWith('time:')) {
        const timeVal = line.substring(5);
        timerTime.innerText = timeVal;
        
        // Circular progress logic based on seconds (Assuming max time is 6 mins = 360 seconds)
        const parts = timeVal.split(':');
        if (parts.length === 2) {
          const m = parseInt(parts[0], 10);
          const s = parseInt(parts[1], 10);
          const totalSecs = (m * 60) + s;
          const maxSecs = 360; // 6 mins limit
          const angle = Math.min(360, (totalSecs / maxSecs) * 360);
          timerProgress.style.setProperty('--timer-angle', `${angle}deg`);
          
          // Overtime Threshold warning trigger (40 seconds for test mode)
          if (totalSecs >= 40) {
            warningBanner.style.display = 'block';
          } else {
            warningBanner.style.display = 'none';
          }
        }
      }
      else if (line.startsWith('status:')) {
        const status = line.substring(7);
        if (status === 'RUNNING') {
          timerStatus.innerText = '동작 중 ⏱️';
        } else {
          timerStatus.innerText = '정지됨 ⏹️';
          warningBanner.style.display = 'none';
        }
      }
      else if (line.startsWith('color:')) {
        const color = line.substring(6);
        updateCharacterState(color);
      }
      else if (line.startsWith('beep:ON')) {
        pulseTimerDisplay();
      }
    }

    function pulseTimerDisplay() {
      timerTime.style.transform = 'scale(1.15)';
      timerTime.style.color = 'var(--color-danger)';
      timerTime.style.transition = 'none';
      setTimeout(() => {
        timerTime.style.transition = 'all 0.3s ease';
        timerTime.style.transform = 'scale(1)';
        timerTime.style.color = 'var(--text-main)';
      }, 150);
    }

    // Toggle Console logs panel visibility
    const btnToggleLogs = document.getElementById('btn-toggle-logs');
    const terminalPanel = document.getElementById('terminal-panel');
    let logsVisible = false;

    btnToggleLogs.addEventListener('click', () => {
      logsVisible = !logsVisible;
      if (logsVisible) {
        terminalPanel.style.display = 'flex';
        btnToggleLogs.querySelector('span').innerText = '통신 로그 접기';
      } else {
        terminalPanel.style.display = 'none';
        btnToggleLogs.querySelector('span').innerText = '통신 로그 보기';
      }
    });

    // Terminal Logger
    function logTerminal(direction, message) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      
      const item = document.createElement('div');
      item.className = 'log-item';
      
      let dirClass = 'sys';
      let dirText = '[SYS]';
      if (direction === 'TX') {
        dirClass = 'tx';
        dirText = '[TX]';
      } else if (direction === 'RX') {
        dirClass = 'rx';
        dirText = '[RX]';
      }

      item.innerHTML = `<span class="log-time">[${timeStr}]</span><span class="log-direction ${dirClass}">${dirText}</span><span class="log-msg"></span>`;
      item.querySelector('.log-msg').textContent = message;
      
      terminalLog.appendChild(item);
      terminalLog.scrollTop = terminalLog.scrollHeight;
      
      if (terminalLog.children.length > 60) {
        terminalLog.removeChild(terminalLog.firstChild);
      }
    }

    // Interactive Button Click Listeners
    btnOverlayConnect.addEventListener('click', connectBLE);
    btnHeaderConnect.addEventListener('click', () => {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      } else {
        connectBLE();
      }
    });

    document.getElementById('btn-trigger-timer').addEventListener('click', () => sendCommand('1'));
    document.getElementById('btn-reset-timer').addEventListener('click', () => sendCommand('2'));
    document.getElementById('btn-mute-buzzer').addEventListener('click', () => sendCommand('3'));

    document.getElementById('btn-clear-logs').addEventListener('click', () => {
      terminalLog.innerHTML = '';
      logTerminal('SYS', '로그 기록이 초기화되었습니다.');
    });
  </script>
</body>
</html>
